[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmd-format"
version = "0.6.0"
description = "JMD (JSON Markdown) — structured data format for LLM-driven infrastructure"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andreas Ostermeyer", email = "andreas@ostermeyer.de" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["jmd", "llm", "structured-data", "json", "markdown", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
# XML companion (jmd.xml) — only required for the JMD-over-XML mapping.
# Install with: pip install "jmd-format[xml]"
xml = ["lxml>=5.0"]

[project.urls]
Homepage = "https://github.com/ostermeyer/jmd-spec"
Repository = "https://github.com/ostermeyer/jmd-impl"

[project.scripts]
jmd = "jmd._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jmd*"]

[tool.setuptools.package-data]
jmd = ["py.typed", "*.c"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle (Google convention)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true

# Pytest 9's stubs ship `@pytest.fixture` and `@pytest.mark.*` as
# `Callable[..., Any]`; under `strict = true` that trips
# `untyped-decorator` on every fixture / parametrize wrapper, even
# though the wrapped functions themselves are fully annotated. The
# tests don't ship as a public surface, so we silence the noise
# rather than annotate each decoration site.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["untyped-decorator"]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.20.1",
    "pytest>=8.0",
    "ruff>=0.15.10",
]
